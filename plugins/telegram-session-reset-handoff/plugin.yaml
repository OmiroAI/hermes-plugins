name: telegram-session-reset-handoff
version: 0.2.1
# Kept at v1 because Hermes 0.21.0's installer accepts v1 manifests only.
# The loader still reads the additive metadata below.
manifest_version: 1
api_version: 1
license: MIT
description: Worker-side continuity handoffs for automatic Telegram session expiry resets.
requires_hermes: "==0.21.0"
provides_hooks:
  - on_session_finalize
  - pre_llm_call
config_schema:
  enabled:
    type: bool
    default: true
    description: Enable Telegram reset handoff processing.
  max_transcript_chars:
    type: int
    default: 24000
    minimum: 1000
    maximum: 50000
    description: Maximum predecessor user and assistant text considered for a handoff.
  max_handoff_chars:
    type: int
    default: 4500
    minimum: 250
    maximum: 4500
    description: Maximum generated handoff context returned live to the first LLM turn.
  retention_days:
    type: int
    default: 30
    minimum: 1
    maximum: 3650
    description: Retention period for compact hashed marker and terminal records.
  max_records:
    type: int
    default: 200
    minimum: 1
    maximum: 200
    description: Maximum compact hashed marker and terminal records retained.
